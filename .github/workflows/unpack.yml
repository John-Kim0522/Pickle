
name: Unpack pickleball app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o pickleball-cup-mvp.zip -d /tmp/pickleball
          cp -a /tmp/pickleball/pickleball-cup/. .
          rm -f pickleball-cup-mvp.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack pickleball app" || exit 0
          git push
