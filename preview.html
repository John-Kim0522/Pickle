<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>제1회 쀼 피클볼 대항전</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--text:#f6f8fb;--muted:#91a3b8;--line:rgba(255,255,255,.09);--lime:#c6ff45;--cyan:#72d8ff;--danger:#ff7b83}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173657 0,var(--bg) 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{width:min(680px,100%);margin:auto;padding:22px 16px 60px}.hero{padding:24px 4px 18px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:900;color:var(--lime)}h1{margin:10px 0 8px;font-size:clamp(31px,8.2vw,46px);line-height:1.02;letter-spacing:-.055em}.hero p{color:var(--muted);font-size:14px;line-height:1.6}.progress{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.05)}.progress strong{font-size:28px}.progress span{font-size:11px;color:var(--muted);font-weight:800}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;top:0;padding:10px 0 8px;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}.tabs button,.cats button{border:1px solid var(--line);background:rgba(13,27,45,.94);color:var(--muted);font-weight:900;border-radius:13px;min-height:44px}.tabs button.active{background:var(--lime);color:#07111f;border-color:var(--lime)}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:3px 0 20px}.cats button{min-height:38px;font-size:12px}.cats button.active{color:var(--lime);border-color:rgba(198,255,69,.5);background:rgba(198,255,69,.08)}.round{margin-bottom:22px}.rtitle{display:flex;justify-content:space-between;margin:0 3px 9px;font-size:12px;font-weight:900}.rtitle small{color:var(--muted)}.cards{display:grid;gap:9px}.card{width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(150deg,#11243a,#091626);color:var(--text);border-radius:17px;padding:13px 14px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:800;margin-bottom:8px}.meta span:last-child{color:var(--cyan)}.card.done .meta span:last-child{color:var(--lime)}.team{display:grid;grid-template-columns:1fr 32px;gap:10px;align-items:center;min-height:31px}.team b{text-align:right;font-size:19px}.team.win strong:after{content:" WIN";font-size:8px;color:var(--lime);margin-left:6px}.sets{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;color:var(--muted);font-size:11px}.rankbox{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:rgba(13,27,45,.8)}.rankhead,.rankrow{display:grid;grid-template-columns:42px minmax(0,1fr) 52px 50px 54px;gap:5px;align-items:center}.rankhead{min-height:38px;padding:0 9px;background:rgba(255,255,255,.04);color:var(--muted);font-size:9px;font-weight:900;text-align:center}.rankhead span:nth-child(2){text-align:left}.rankrow{min-height:58px;padding:0 9px;border-top:1px solid var(--line);font-size:12px;text-align:center}.rankrow span:nth-child(2){text-align:left;font-weight:800}.rank{width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;margin:auto;font-weight:900}.rank.first{background:var(--lime);color:#07111f}.plus{color:var(--lime);font-weight:900}.rule{color:var(--muted);font-size:10px;line-height:1.5}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:none;align-items:flex-end}.modal{width:min(680px,100%);margin:auto;background:#0c1b2c;border-radius:24px 24px 0 0;padding:12px 18px 25px;max-height:92vh;overflow:auto}.handle{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 16px}.mmeta{color:var(--lime);font-size:10px;font-weight:900}.modal h2{font-size:20px;margin:7px 0 4px}.modal h2 em{font-size:12px;color:var(--muted);font-style:normal}.score-rule{color:var(--muted);font-size:10px}.setgrid{display:grid;grid-template-columns:42px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}.setgrid.head{font-size:9px;color:var(--muted);text-align:center}.setgrid input{width:100%;height:58px;border:1px solid var(--line);border-radius:13px;background:#07111f;color:var(--text);font-size:25px;font-weight:900;text-align:center}.pin{display:grid;gap:6px;margin-top:18px;color:var(--muted);font-size:10px}.pin input{height:48px;border:1px solid var(--line);border-radius:13px;background:#07111f;color:var(--text);padding:0 14px}.err{display:none;color:#ffc2c6;background:rgba(255,123,131,.1);border:1px solid rgba(255,123,131,.2);border-radius:11px;padding:9px 11px;font-size:11px}.save,.clear,.close{width:100%;border:0;border-radius:13px;min-height:49px;margin-top:9px;font-weight:900}.save{background:var(--lime);color:#07111f}.clear{background:rgba(255,123,131,.12);color:#ffb8bd}.close{background:transparent;color:var(--muted)}@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.backdrop{align-items:center;padding:20px}.modal{border-radius:24px}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div class="eyebrow">COUPLES · SINGLES · ROUND ROBIN</div><h1>제1회 쀼 피클볼 대항전</h1><p>8명이 함께하는 풀리그. 모든 경기는 3판 2선승, 각 세트 11점이며 듀스에서는 2점 차로 승리합니다.</p><div class="progress"><strong id="doneCount">0</strong><span>완료 경기 / 전체 18경기</span></div></section>
<nav class="tabs"><button id="matchTab" class="active">대진 · 결과</button><button id="rankTab">순위</button></nav>
<div class="cats"><button data-cat="doubles" class="active">부부 복식</button><button data-cat="mens">남자 단식</button><button data-cat="womens">여자 단식</button></div>
<section id="content"></section>
</main>
<div class="backdrop" id="backdrop"><section class="modal"><div class="handle"></div><div class="mmeta" id="modalMeta"></div><h2 id="modalTitle"></h2><p class="score-rule">11점 선취 · 10:10 듀스부터 2점 차 · 3판 2선승</p><div class="setgrid head"><span>세트</span><span id="headA"></span><span id="headB"></span></div><div id="setRows"></div><label class="pin">대회 공용 PIN<input id="pin" type="password" inputmode="numeric" placeholder="미리보기 PIN: 1234"></label><p class="err" id="err"></p><button class="save" id="save">경기 결과 저장</button><button class="clear" id="clear">결과 초기화</button><button class="close" id="close">닫기</button></section></div>
<script>
const players=[
{id:1,name:'곽성민',g:'M',team:1},{id:2,name:'김정훈',g:'M',team:2},{id:3,name:'윤희철',g:'M',team:3},{id:4,name:'박성민',g:'M',team:4},
{id:5,name:'성지혜',g:'F',team:1},{id:6,name:'조혜민',g:'F',team:2},{id:7,name:'이지영',g:'F',team:3},{id:8,name:'심우연',g:'F',team:4}];
const base=[
[1,'doubles',1,[1,5],[4,8]],[2,'doubles',1,[2,6],[3,7]],[3,'doubles',2,[1,5],[3,7]],[4,'doubles',2,[4,8],[2,6]],[5,'doubles',3,[1,5],[2,6]],[6,'doubles',3,[3,7],[4,8]],
[7,'mens',1,[1],[4]],[8,'mens',1,[2],[3]],[9,'mens',2,[1],[3]],[10,'mens',2,[4],[2]],[11,'mens',3,[1],[2]],[12,'mens',3,[3],[4]],
[13,'womens',1,[5],[8]],[14,'womens',1,[6],[7]],[15,'womens',2,[5],[7]],[16,'womens',2,[8],[6]],[17,'womens',3,[5],[6]],[18,'womens',3,[7],[8]]
].map(x=>({id:x[0],cat:x[1],round:x[2],a:x[3],b:x[4],sets:[[null,null],[null,null],[null,null]]}));
let matches=JSON.parse(localStorage.getItem('pp-match-v2')||'null')||base;
let tab='matches',cat='doubles',editing=null;
const labels={doubles:'부부 복식',mens:'남자 단식',womens:'여자 단식'};
const nameSide=ids=>ids.map(id=>players.find(p=>p.id===id).name).join(' · ');
const validSet=(a,b)=>{if(!Number.isInteger(a)||!Number.isInteger(b)||a===b)return false;const hi=Math.max(a,b),lo=Math.min(a,b);return(hi===11&&lo<=9)||(lo>=10&&hi===lo+2)};
function summary(m){let sa=0,sb=0,pa=0,pb=0;for(const [a,b] of m.sets){if(a==null||b==null)continue;pa+=a;pb+=b;if(a>b)sa++;else sb++;}return{sa,sb,pa,pb,done:sa===2||sb===2,w:sa===2?'A':sb===2?'B':null}}
function entityId(m,side){const ids=side==='A'?m.a:m.b;if(m.cat==='doubles')return players.find(p=>p.id===ids[0]).team;return ids[0]}
function rowsFor(c){let rows;if(c==='doubles')rows=[1,2,3,4].map(id=>({id,name:players.filter(p=>p.team===id).map(p=>p.name).join(' · ')}));else{const g=c==='mens'?'M':'F';rows=players.filter(p=>p.g===g).map(p=>({id:p.id,name:p.name}))}rows=rows.map(r=>({...r,w:0,l:0,sf:0,sa:0,pf:0,pa:0}));for(const m of matches.filter(m=>m.cat===c)){const s=summary(m);if(!s.done)continue;const a=rows.find(r=>r.id===entityId(m,'A')),b=rows.find(r=>r.id===entityId(m,'B'));a.sf+=s.sa;a.sa+=s.sb;a.pf+=s.pa;a.pa+=s.pb;b.sf+=s.sb;b.sa+=s.sa;b.pf+=s.pb;b.pa+=s.pa;if(s.w==='A'){a.w++;b.l++}else{b.w++;a.l++}}rows.forEach(r=>{r.sd=r.sf-r.sa;r.pd=r.pf-r.pa});const groups={};rows.forEach(r=>(groups[r.w]??=[]).push(r));return Object.keys(groups).map(Number).sort((a,b)=>b-a).flatMap(w=>{const g=groups[w];if(g.length===2){const h=matches.find(m=>m.cat===c&&summary(m).done&&new Set([entityId(m,'A'),entityId(m,'B')]).has(g[0].id)&&new Set([entityId(m,'A'),entityId(m,'B')]).has(g[1].id));if(h){const s=summary(h),wid=entityId(h,s.w);return wid===g[0].id?g:[g[1],g[0]]}}return g.sort((a,b)=>b.sd-a.sd||b.pd-a.pd||b.pf-a.pf||a.name.localeCompare(b.name,'ko'))})}
function render(){document.getElementById('doneCount').textContent=matches.filter(m=>summary(m).done).length;document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));document.getElementById('matchTab').classList.toggle('active',tab==='matches');document.getElementById('rankTab').classList.toggle('active',tab==='ranking');const content=document.getElementById('content');if(tab==='ranking'){const rows=rowsFor(cat);content.innerHTML=`<div class="rtitle"><span>${labels[cat]} 순위</span><small>승수 → 맞대결 → 세트득실 → 점수득실</small></div><div class="rankbox"><div class="rankhead"><span>순위</span><span>${cat==='doubles'?'팀':'선수'}</span><span>승-패</span><span>세트</span><span>득실</span></div>${rows.map((r,i)=>`<div class="rankrow"><span class="rank ${i===0?'first':''}">${i+1}</span><span>${r.name}</span><span>${r.w}-${r.l}</span><span class="${r.sd>0?'plus':''}">${r.sd>0?'+':''}${r.sd}</span><span class="${r.pd>0?'plus':''}">${r.pd>0?'+':''}${r.pd}</span></div>`).join('')}</div><p class="rule">※ 같은 승수인 2명/2팀은 맞대결 승자를 우선합니다. 3명 이상 동률이면 세트 득실 → 점수 득실 순으로 비교합니다.</p>`;return}const ms=matches.filter(m=>m.cat===cat);content.innerHTML=[1,2,3].map(r=>`<div class="round"><div class="rtitle"><span>ROUND ${r}</span><small>2 MATCHES</small></div><div class="cards">${ms.filter(m=>m.round===r).map(m=>{const s=summary(m),st=m.sets.filter(x=>x[0]!=null).map(x=>x.join(':')).join(' · ');return`<button class="card ${s.done?'done':''}" onclick="openMatch(${m.id})"><div class="meta"><span>#${m.id}</span><span>${s.done?'경기 종료':'결과 입력'}</span></div><div class="team ${s.w==='A'?'win':''}"><strong>${nameSide(m.a)}</strong><b>${s.done?s.sa:'-'}</b></div><div class="team ${s.w==='B'?'win':''}"><strong>${nameSide(m.b)}</strong><b>${s.done?s.sb:'-'}</b></div>${s.done?`<div class="sets">${st}</div>`:''}</button>`}).join('')}</div></div>`).join('')}
window.openMatch=id=>{editing=matches.find(m=>m.id===id);document.getElementById('backdrop').style.display='flex';document.getElementById('modalMeta').textContent=`${labels[editing.cat]} · ROUND ${editing.round}`;document.getElementById('modalTitle').innerHTML=`${nameSide(editing.a)} <em>vs</em> ${nameSide(editing.b)}`;document.getElementById('headA').textContent=nameSide(editing.a);document.getElementById('headB').textContent=nameSide(editing.b);document.getElementById('setRows').innerHTML=editing.sets.map((s,i)=>`<div class="setgrid"><strong>${i+1}</strong><input inputmode="numeric" id="s${i}a" value="${s[0]??''}" placeholder="-"><input inputmode="numeric" id="s${i}b" value="${s[1]??''}" placeholder="-"></div>`).join('');document.getElementById('clear').style.display=summary(editing).done?'block':'none';document.getElementById('err').style.display='none';document.getElementById('pin').value=''};
function close(){document.getElementById('backdrop').style.display='none';editing=null}document.getElementById('close').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('matchTab').onclick=()=>{tab='matches';render()};document.getElementById('rankTab').onclick=()=>{tab='ranking';render()};document.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
function fail(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='block'}
document.getElementById('save').onclick=()=>{if(document.getElementById('pin').value!=='1234')return fail('PIN이 올바르지 않습니다. 미리보기 PIN은 1234입니다.');const sets=[0,1,2].map(i=>{const av=document.getElementById(`s${i}a`).value,bv=document.getElementById(`s${i}b`).value;return[av===''?null:Number(av),bv===''?null:Number(bv)]});if(!validSet(...sets[0]))return fail('1세트 결과를 확인해주세요. 11점 선취, 듀스는 2점 차입니다.');if(!validSet(...sets[1]))return fail('2세트 결과를 확인해주세요. 11점 선취, 듀스는 2점 차입니다.');let a=(sets[0][0]>sets[0][1]?1:0)+(sets[1][0]>sets[1][1]?1:0),b=2-a;if(a===1&&b===1){if(!validSet(...sets[2]))return fail('1:1이므로 3세트 결과가 필요합니다.');}else if(sets[2][0]!=null||sets[2][1]!=null)return fail('2:0으로 승부가 끝났으므로 3세트는 비워주세요.');editing.sets=sets;localStorage.setItem('pp-match-v2',JSON.stringify(matches));close();render()};document.getElementById('clear').onclick=()=>{if(document.getElementById('pin').value!=='1234')return fail('PIN이 올바르지 않습니다. 미리보기 PIN은 1234입니다.');editing.sets=[[null,null],[null,null],[null,null]];localStorage.setItem('pp-match-v2',JSON.stringify(matches));close();render()};render();
</script>
</body></html>
